name: Plugin problem
description: A plugin fails to install, load, or render
body:
  - type: input
    id: source
    attributes:
      label: Where the plugin came from
      description: The repository URL you installed from, or "generated by the skill".
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: >
        Install refused? Error card in the panel? Wrong rendering? Paste the
        exact sentence shown - the wording identifies the code path.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `lumanin doctor`
      render: text
    validations:
      required: true
