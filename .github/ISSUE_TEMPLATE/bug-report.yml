name: Bug report
description: Something is broken or behaves wrong
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you do, what did you expect, what happened instead.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `lumanin doctor`
      description: >
        Paste it whole. It names your desktop, which backend won for every
        capability, and what is unverified - it answers most of what we would
        otherwise ask you.
      render: text
    validations:
      required: true
  - type: input
    id: desktop
    attributes:
      label: Desktop and version
      placeholder: e.g. KDE Plasma 6.3, Hyprland 0.56, GNOME 48
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log lines, if any
      description: >
        `~/.local/state/lumanin/logs/lumanin.jsonl` - the last lines around the
        problem. Skip it if nothing relevant is there.
      render: text
